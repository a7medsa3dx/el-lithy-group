
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b3f">
  <title>EL-LITHY GROUP | نظام الموظفين</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      color: #172b3a;
      font-family: Arial, sans-serif;
    }
    .container {
      width: 100%;
      max-width: 430px;
      padding: 32px 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px #102b3f14;
    }
    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: #102b3f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }
    h1 { text-align: center; font-size: 23px; margin: 0 0 8px; }
    .subtitle {
      text-align: center;
      color: #718096;
      font-size: 14px;
      margin-bottom: 25px;
    }
    label { display: block; margin: 15px 0 8px; font-size: 14px; }
    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #dce4eb;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #1c7890; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #102b3f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .notice {
      margin-top: 20px;
      padding: 13px;
      background: #f1f7fa;
      border-radius: 10px;
      color: #587080;
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
      white-space: pre-wrap;
    }
    .hidden { display: none !important; }
    footer {
      text-align: center;
      color: #9aa8b3;
      font-size: 11px;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">EL</div>
    <h1>EL-LITHY GROUP</h1>
    <p class="subtitle">نظام الحضور والانصراف وإدارة الموظفين</p>

    <section id="loginSection">
      <form id="loginForm">
        <label for="username">كود الموظف</label>
        <input id="username" type="text" placeholder="مثال: EMP001"
          autocomplete="username" required>

        <label for="password">كلمة المرور</label>
        <input id="password" type="password" placeholder="أدخل كلمة المرور"
          autocomplete="current-password" required>

        <button id="loginButton" type="submit">تسجيل الدخول</button>
      </form>
    </section>

    <section id="recoverySection" class="hidden">
      <h2 style="text-align:center;font-size:19px">تعيين كلمة مرور جديدة</h2>
      <form id="recoveryForm">
        <label for="newPassword">كلمة المرور الجديدة</label>
        <input id="newPassword" type="password"
          autocomplete="new-password" minlength="8" required>

        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <input id="confirmPassword" type="password"
          autocomplete="new-password" minlength="8" required>

        <button id="savePasswordButton" type="submit">حفظ كلمة المرور</button>
      </form>
    </section>

    <section id="dashboardSection" class="hidden">
      <h2 style="text-align:center">مرحبًا بك</h2>
      <p>الاسم: <strong id="employeeName"></strong></p>
      <p>كود الموظف: <strong id="employeeCode"></strong></p>
      <p>الصلاحية: <strong id="employeeRole"></strong></p>
      <div class="notice">
        تم تسجيل الدخول بنجاح.
        سيتم تفعيل خدمات الحضور والانصراف والإدارة في المراحل التالية.
      </div>
      <button id="logoutButton" type="button">تسجيل الخروج</button>
    </section>

    <div class="notice" id="message">
      مرحبًا بك في نظام EL-LITHY GROUP.
    </div>

    <footer>EL-LITHY GROUP © 2026</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://xksqddhhnrpmutkxjjaj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_kd5hsMt6TkRExJ-P9Cud6Q_5BCzWopz";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const $ = id => document.getElementById(id);

    function showMessage(message) {
      $("message").textContent = message;
    }

    function showSection(section) {
      ["loginSection", "recoverySection", "dashboardSection"]
        .forEach(id => $(id).classList.add("hidden"));
      $(section).classList.remove("hidden");
    }

    async function showDashboard() {
      const { data: userData, error: userError } =
        await db.auth.getUser();

      if (userError || !userData.user) {
        throw new Error("تعذر التحقق من حساب المستخدم.");
      }

      const { data: profile, error } = await db
        .from("profiles")
        .select("full_name, employee_code, role")
        .eq("id", userData.user.id)
        .single();

      if (error || !profile) {
        throw new Error("لم يتم العثور على بيانات الموظف.");
      }

      $("employeeName").textContent = profile.full_name;
      $("employeeCode").textContent = profile.employee_code;
      $("employeeRole").textContent =
        profile.role === "owner" ? "مدير النظام" : "موظف";

      showSection("dashboardSection");
      showMessage("تم تسجيل الدخول بنجاح.");
    }

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();

      const employee_code = $("username").value.trim().toUpperCase();
      const password = $("password").value;

      $("loginButton").disabled = true;
      showMessage("جارٍ التحقق من بيانات الدخول...");

      try {
        const { data, error } = await db.functions.invoke(
          "employee-login",
          { body: { employee_code, password } }
        );

        if (error || !data || !data.success || !data.session) {
          throw new Error(
            data?.error || error?.message || "كود الموظف أو كلمة المرور غير صحيحة."
          );
        }

        const { error: sessionError } = await db.auth.setSession({
          access_token: data.session.access_token,
          refresh_token: data.session.refresh_token
        });

        if (sessionError) throw sessionError;

        await showDashboard();

      } catch (error) {
        showMessage(error.message || "حدث خطأ أثناء تسجيل الدخول.");
      } finally {
        $("loginButton").disabled = false;
      }
    });

    $("recoveryForm").addEventListener("submit", async event => {
      event.preventDefault();

      const newPassword = $("newPassword").value;
      const confirmPassword = $("confirmPassword").value;

      if (newPassword.length < 8) {
        showMessage("كلمة المرور يجب ألا تقل عن 8 أحرف.");
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage("كلمتا المرور غير متطابقتين.");
        return;
      }

      $("savePasswordButton").disabled = true;
      showMessage("جارٍ حفظ كلمة المرور الجديدة...");

      try {
        const { data: sessionData } = await db.auth.getSession();

        if (!sessionData.session) {
          throw new Error("انتهت صلاحية رابط الاستعادة. اطلب رابطًا جديدًا.");
        }

        const { error } = await db.auth.updateUser({
          password: newPassword
        });

        if (error) throw error;

        await db.auth.signOut();

        $("recoveryForm").reset();
        $("loginForm").reset();
        showSection("loginSection");
        showMessage("تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.");

      } catch (error) {
        showMessage(error.message || "تعذر تغيير كلمة المرور.");
      } finally {
        $("savePasswordButton").disabled = false;
      }
    });

    $("logoutButton").addEventListener("click", async () => {
      await db.auth.signOut();
      $("loginForm").reset();
      showSection("loginSection");
      showMessage("تم تسجيل الخروج.");
    });

    async function initializeApp() {
      const hashParams = new URLSearchParams(
        window.location.hash.substring(1)
      );
      const queryParams = new URLSearchParams(
        window.location.search
      );

      const isRecoveryLink =
        hashParams.get("type") === "recovery" ||
        queryParams.get("type") === "recovery";

      const { data } = await db.auth.getSession();

      if (isRecoveryLink) {
        if (data.session) {
          showSection("recoverySection");
          showMessage("أدخل كلمة المرور الجديدة مرتين.");
        } else {
          showSection("loginSection");
          showMessage("رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا.");
        }
        return;
      }

      if (data.session) {
        try {
          await showDashboard();
        } catch (error) {
          showSection("loginSection");
          showMessage(error.message);
        }
      } else {
        showSection("loginSection");
        showMessage("أدخل كود الموظف وكلمة المرور لتسجيل الدخول.");
      }
    }

    initializeApp();
  </script>
</body>
</html>
