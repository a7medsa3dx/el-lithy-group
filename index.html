<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b3f">
  <title>EL-LITHY GROUP | نظام الموظفين</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172b3a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 12px 40px #102b3f14;
    }
    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: #102b3f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }
    h1 { text-align: center; font-size: 23px; margin: 0 0 8px; }
    .subtitle {
      text-align: center;
      color: #718096;
      font-size: 14px;
      margin-bottom: 30px;
    }
    label { display: block; margin: 15px 0 8px; font-size: 14px; }
    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #dce4eb;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #1c7890; }
    button {
      width: 100%;
      margin-top: 23px;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #102b3f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .notice {
      margin-top: 20px;
      padding: 13px;
      background: #f1f7fa;
      border-radius: 10px;
      color: #587080;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    }
    footer {
      text-align: center;
      color: #9aa8b3;
      font-size: 11px;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">EL</div>
    <h1>EL-LITHY GROUP</h1>
    <p class="subtitle">نظام الحضور والانصراف وإدارة الموظفين</p>

    <form id="loginForm">
      <label for="username">كود الموظف</label>
      <input id="username" type="text" placeholder="مثال: EMP001"
             autocomplete="username" required>

      <label for="password">كلمة المرور</label>
      <input id="password" type="password" placeholder="أدخل كلمة المرور"
             autocomplete="current-password" required>

      <button type="submit">تسجيل الدخول</button>
    </form>

    <div class="notice" id="message">
      مرحبًا بك في نظام EL-LITHY GROUP.
      سيتم تفعيل تسجيل الدخول بعد استكمال ربط الحسابات وقاعدة البيانات.
    </div>

    <footer>EL-LITHY GROUP © 2026</footer>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("message").textContent =
        "لم يتم تفعيل تسجيل الدخول بعد. انتظر استكمال إعداد النظام.";
    });
  </script>
</body>
</html>
